<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2747a8"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style></head><body>
<title>사진관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 상단 얇은 날짜줄 + 분류칩 → 1.5cm 썸네일 고밀도 목록. 사진 탭 → 어둡게 깔고 가운데 집중 보기(펼친 화면은 사진|메모 2단) */
:root{
  --bg:#f3f4f6; --card:#ffffff; --fg:#1b1f27; --mute:#6b7280; --line:#dfe2e8;
  --accent:#2747a8; --accent-soft:#e3e9fa; --ok:#1f8a5b; --warn:#b4332f;
  --shade:rgba(12,15,22,.9);
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fs:12px; --th:1.5cm; --vw:72;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b; --card:#1b1f27; --fg:#e7e9ee; --mute:#9aa1ad; --line:#2b313c;
  --accent:#8ea8ff; --accent-soft:#232c45; --ok:#4cc38a; --warn:#ff7b72; --shade:rgba(0,0,0,.92); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --card:#1b1f27; --fg:#e7e9ee; --mute:#9aa1ad; --line:#2b313c;
  --accent:#8ea8ff; --accent-soft:#232c45; --ok:#4cc38a; --warn:#ff7b72; --shade:rgba(0,0,0,.92); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 var(--fs)/1.45 var(--f-body);margin:0;padding-inline:max(10px,env(safe-area-inset-left,0px));overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{max-width:1100px;margin:0 auto;padding-block:6px 80px}
/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:4px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:4px}
.ib{min-width:36px;height:36px;border-radius:8px;display:inline-grid;place-items:center;font-size:16px;border:1px solid var(--line);background:var(--card)}
.ib.on{border-color:var(--accent);background:var(--accent-soft)}
.date{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:calc(var(--fs) + 1px)}
.date .n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.date small{color:var(--mute);font-weight:400}
.today{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:9px;padding:0 6px}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);background:var(--card);font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip b{font-weight:500;color:var(--mute);font-family:var(--f-num);font-size:12px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chip.on b{color:inherit}
.search{display:flex;gap:4px}
.search input{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);padding:0 8px;font:inherit}
/* 목록 */
.list{display:grid;grid-template-columns:1fr;gap:4px;margin-top:4px}
@media (min-width:700px){.list{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.list{grid-template-columns:1fr 1fr 1fr}}
.it{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px;min-width:0;text-align:left;width:100%}
.it.done{opacity:.55}
.th{flex:none;width:var(--th);height:var(--th);border-radius:4px;object-fit:cover;object-position:top;background:var(--line)}
.ix{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ix .h{display:flex;align-items:center;gap:5px;min-width:0}
.sq{font-family:var(--f-num);color:var(--accent);font-size:12px}
.cat{font-size:12px;padding:0 5px;border-radius:3px;white-space:nowrap}
.src{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
.ck.on{border-color:var(--ok);background:var(--ok);color:var(--card)}
.dh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding:2px 2px;border-bottom:1px solid var(--line);font-weight:600}
.dh small{color:var(--mute);font-weight:400;font-family:var(--f-num)}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:8px;padding:24px 12px;text-align:center;color:var(--mute);line-height:1.7}
.empty button{color:var(--accent);font-weight:600}
.hint{color:var(--mute);font-size:12px;text-align:center;margin-top:8px}
/* 메뉴 */
.menu{position:absolute;right:0;top:34px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;display:flex;flex-direction:column;min-width:150px;z-index:20}
.menu button{text-align:left;padding:7px 8px;border-radius:5px}
.menu button:hover{background:var(--accent-soft)}
/* 집중 보기 */
.ov{position:fixed;inset:0;z-index:30;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.vbox{width:100%;max-width:1200px;max-height:100%;display:grid;grid-template-columns:1fr;gap:10px;align-items:center;justify-items:center;overflow:auto}
@media (min-width:700px){.vbox{grid-template-columns:minmax(0,1.8fr) minmax(250px,1fr)}}
.stage{display:flex;align-items:center;justify-content:center;max-width:100%;touch-action:pan-y}
.stage img{max-width:94vw;max-height:58vh;cursor:zoom-in;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#222}
@media (min-width:700px){.stage img{max-width:100%;max-height:88vh}}
.stage.scroll{max-height:62vh;overflow:auto;align-items:flex-start}
.stage.scroll img{max-height:none;max-width:min(92vw,560px)}
.pane{width:100%;max-width:520px;background:var(--card);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.pane .lb{font-size:12px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:6px}
.pane .lb .sv{margin-left:auto;font-weight:500}
.pane .lb .sv.dirty{color:var(--warn)}.pane .lb .sv.ok{color:var(--ok)}
.gsq{width:36px;height:36px;border-radius:8px;border:3px solid var(--line);background:var(--bg)}
.gsq.g-A{border-color:var(--gA)}.gsq.g-B{border-color:var(--gB)}.gsq.g-C{border-color:var(--gC)}
.gsq.on.g-A{background:var(--gA)}.gsq.on.g-B{background:var(--gB)}.gsq.on.g-C{background:var(--gC)}
.ibx{width:40px;height:36px;padding:0;font-size:17px}
.gcy{width:52px;height:40px;border-radius:9px;border:2px dashed var(--line);background:var(--bg);font-size:11px;color:var(--mute);font-weight:600}
.gcy.g-A{background:var(--gA);border:0;color:#fff}.gcy.g-B{background:var(--gB);border:0;color:#fff}.gcy.g-C{background:var(--gC);border:0;color:#fff}
.btn.pri.done{background:var(--ok);border-color:var(--ok)}
.thw{flex:none;width:calc(var(--th) * 1.35);height:var(--th);border-radius:4px;overflow:hidden;background:var(--line);position:relative}
.thw img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:top;max-width:none}
.thw img.rg{object-fit:fill}
.fin{display:inline-block;margin-left:6px;font-size:11px;color:#fff;background:var(--ok);border-radius:9px;padding:1px 8px;font-weight:600}
.fill{height:28px;padding:0 10px;border-radius:14px;background:var(--accent);color:var(--card);font-size:12.5px;font-weight:600}
/* 사진만 보기 */
.solo{position:fixed;inset:0;z-index:45;background:#000;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center}
.solo img{display:block;margin:0 auto;width:100%;max-width:1000px;height:auto}
.solo.fit{display:flex;align-items:center;justify-content:center}.solo.fit img{width:auto;max-width:100vw;max-height:100vh}
.solo .sb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:46;height:40px;min-width:40px;padding:0 12px;border-radius:20px;background:rgba(0,0,0,.55);color:#fff;font-size:15px;border:1px solid rgba(255,255,255,.3)}
/* 자르기 */
.cst{position:relative;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;background:#000;border-radius:8px;overflow:hidden}
.cst canvas{display:block;width:100%;height:auto}
.cbx{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55)}
.cbx i{position:absolute;width:28px;height:28px}
.cbx i::after{content:"";position:absolute;width:14px;height:14px;border:3px solid #fff}
.cbx .nw{left:-6px;top:-6px}.cbx .nw::after{left:4px;top:4px;border-right:0;border-bottom:0}
.cbx .ne{right:-6px;top:-6px}.cbx .ne::after{right:4px;top:4px;border-left:0;border-bottom:0}
.cbx .sw{left:-6px;bottom:-6px}.cbx .sw::after{left:4px;bottom:4px;border-right:0;border-top:0}
.cbx .se{right:-6px;bottom:-6px}.cbx .se::after{right:4px;bottom:4px;border-left:0;border-top:0}
.pane .h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pane textarea{width:100%;min-height:46px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;padding:6px;box-sizing:border-box}
.pane input[type=text],.pane input[type=date]{height:36px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;padding:0 6px;min-width:0}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.btn{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:14px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ok.on{background:var(--ok);color:var(--card)}
.btn.del{color:var(--warn)}
.btn.del.arm{background:var(--warn);border-color:var(--warn);color:var(--card)}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:34px;height:52px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-size:18px;z-index:31}
.nav.l{left:6px}.nav.r{right:6px}
.x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:32;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:16px}
.pos{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:12px;z-index:32;color:#fff;opacity:.75;font-family:var(--f-num);font-size:13px}
/* 시트 */
.sheet{position:fixed;inset:auto 0 0 0;z-index:40;background:var(--card);border-top:1px solid var(--line);border-radius:12px 12px 0 0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 14px);max-height:75vh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.sheet h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px}
.sheet .r{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}
.sheet .r input{flex:1;min-width:0;height:28px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);font:inherit;padding:0 6px}
.sheet label{flex:1}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 12px;border-radius:14px;font-size:11px;z-index:50}
.fab{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--card);font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.ai{border:1px dashed var(--accent);border-radius:6px;padding:5px 6px;display:flex;flex-direction:column;gap:4px;background:var(--accent-soft)}
.ai .t{font-size:12px;color:var(--accent);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.ai .ms{display:flex;flex-direction:column;gap:4px}
.ai .ms button{font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 9px;text-align:left}
.ai .ms button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.spin{display:inline-block;width:9px;height:9px;border:1.5px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.cg{grid-column:1/-1;display:flex;align-items:center;gap:6px;margin-top:8px;padding:4px 2px;border-bottom:1px solid var(--line);font-weight:600;text-align:left;width:100%}
.cg i{width:9px;height:9px;border-radius:50%}
.cg small{color:var(--mute);font-weight:400;font-family:var(--f-num)}
.cg .ar{margin-left:auto;color:var(--mute);font-weight:400}
.it .dt{font-family:var(--f-num);font-size:12px;color:var(--mute);white-space:nowrap}
.badge{font-size:9px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 3px}

/* 등급 A 또 볼 것 · B 필요할 때 · C 봤고 끝 · D 쓸모없음 — 왼쪽 굵은 띠 */
:root{--gA:#d32f2f;--gB:#1e63c6;--gC:#2e8b57;--gD:#8a8f98}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gA:#ff6b6b;--gB:#6aa5ff;--gC:#5fcf8f;--gD:#7b828d}}
:root[data-theme="dark"]{--gA:#ff6b6b;--gB:#6aa5ff;--gC:#5fcf8f;--gD:#7b828d}
.it{--gc:transparent}
.it.g-A{--gc:var(--gA)}.it.g-B{--gc:var(--gB)}.it.g-C{--gc:var(--gC)}.it.g-D{--gc:var(--gD)}
.it[class*="g-"]{box-shadow:inset 14px 0 0 var(--gc);padding-left:19px;border-color:var(--gc)}
.gb{flex:none;width:32px;height:32px;border-radius:7px;border:1.5px dashed var(--line);font:800 16px/1 var(--f-num);color:var(--mute);display:grid;place-items:center}
.gb.g-A,.gb.g-B,.gb.g-C,.gb.g-D{border:0;color:#fff}
.gb.g-A{background:var(--gA)}.gb.g-B{background:var(--gB)}.gb.g-C{background:var(--gC)}.gb.g-D{background:var(--gD)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 5px;font-size:12px;color:var(--mute)}
.legend span{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:3px;color:#fff;font:800 10px/1 var(--f-num);margin-left:4px}
.legend span:first-child{margin-left:0}
.legend em{font-style:normal;opacity:.8}
.gf{height:28px;padding:0 9px 0 5px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:12.5px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;color:var(--fg)}
.gf[data-gf=""]{padding-left:7px}
.gf span{margin:0!important;width:12px;height:12px;border-radius:50%;background:var(--gD)}
.gf b{font:600 12px var(--f-num);color:var(--mute)}
.gf.g-A{border-color:var(--gA)}.gf.g-B{border-color:var(--gB)}.gf.g-C{border-color:var(--gC)}
.gf.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}.gf.on b{color:inherit}
.gf.g-A.on{background:var(--gA);border-color:var(--gA)}.gf.g-B.on{background:var(--gB);border-color:var(--gB)}.gf.g-C.on{background:var(--gC);border-color:var(--gC)}
.legend .g-A span,.gbtn.g-A.on{background:var(--gA)}.legend .g-B span,.gbtn.g-B.on{background:var(--gB)}.legend .g-C span,.gbtn.g-C.on{background:var(--gC)}.legend .g-D,.gbtn.g-D.on{background:var(--gD)}
.gpick{display:flex;gap:3px}
.gbtn{height:34px;min-width:44px;padding:0 6px;border-radius:6px;border:2px solid var(--line);background:var(--bg);font:800 15px/1 var(--f-num);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.gbtn small{font:500 9px/1 var(--f-body)}
.gbtn.g-A{border-color:var(--gA);color:var(--gA)}.gbtn.g-B{border-color:var(--gB);color:var(--gB)}.gbtn.g-C{border-color:var(--gC);color:var(--gC)}.gbtn.g-D{border-color:var(--gD);color:var(--gD)}
.gbtn.on{color:#fff}
@media (prefers-reduced-motion:no-preference){.it{transition:opacity .15s}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<div class="wrap" id="app">
  <div class="top">
    <div class="row" style="position:relative">
      <button class="ib" id="bPrev" aria-label="이전 날짜">‹</button>
      <div class="date" id="dLabel"></div>
      <button class="ib" id="bNext" aria-label="다음 날짜">›</button>
      <span id="tools" class="row"></span>
      <button class="ib" id="bMore" aria-label="더보기">⋯</button>
      <button class="ib" id="bFs" aria-label="전체화면">⛶</button>
      <div class="menu" id="menu" hidden></div>
    </div>
    <div class="search" id="sBar" hidden>
      <input id="sIn" type="search" placeholder="메모·분류·출처 검색 (전체 날짜)" autocomplete="off">
      <button class="ib" id="sClose" aria-label="검색 닫기">✕</button>
    </div>
    <div class="row" id="rBar" hidden>
      <button class="chip" data-rm="3">3일</button>
      <button class="chip" data-rm="7">1주</button>
      <span style="flex:1"></span>
      <button class="ib" id="rPrev" aria-label="이전">«</button>
      <span id="rLabel" class="sq" style="color:var(--fg)"></span>
      <button class="ib" id="rNext" aria-label="다음">»</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="legend" id="legend"></div>
    <div class="legend" id="mfBar"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="hint" id="hint"></div>
</div>
<button class="fab" id="bAdd" aria-label="사진 추가">＋</button>
<input type="file" id="fIn" accept="image/*" multiple hidden>
<div id="ovRoot"></div>
<div id="sheetRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('pm_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('pm_'+k,JSON.stringify(v))}catch(e){}}};
const PAL=['#2747a8','#c2410c','#15803d','#7c3aed','#b91c1c','#0e7490','#a16207','#be185d','#475569','#4d7c0f'];
const CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const WD='일월화수목금토';
const pad=n=>String(n).padStart(2,'0');

/* ───── 저장소: claude.ai(db+assets) / 단독(IndexedDB) ───── */
const Store={ok:false,canUp:false,
  async init(){return LOCAL?this.initLocal():this.initCloud()},
  async initCloud(){
    let db=null;try{db=await window.claude.use('db')}catch(e){}
    try{this.assets=await window.claude.use('assets')}catch(e){}
    if(!db)return;this.ok=true;this.canUp=!!this.assets;
    const photos=db.collection('photos'),meta=db.doc('meta/cats');this.photos=photos;this.meta=meta;this.db=db;
    this.loadLearn().then(l=>learn=l);
    meta.onSnapshot(s=>{st.cats=(s.exists&&s.data().list)||['미분류'];onData()},()=>{});
    photos.onSnapshot(s=>{setAll(s.docs.map(d=>({id:d.id,...d.data()})));ready=true;onData()},e=>{ready=true;onData();toast('불러오기 실패: '+e.code)});
  },
  img(x){return x.aid?(LOCAL?(urlCache[x.aid]||''):'/_blob/'+x.aid):''},
  async blob(x){if(LOCAL)return idbGet('blobs',x.aid);const r=await fetch('/_blob/'+x.aid);return r.blob()},
  async upload(b){if(LOCAL){const aid='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);await idbPut('blobs',b,aid);urlCache[aid]=URL.createObjectURL(b);return aid}return (await this.assets.upload(b)).id},
  async add(doc){if(LOCAL){const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await idbPut('photos',{id,...doc});return id}return (await this.photos.add(doc)).id},
  async update(id,f){if(LOCAL){const x=await idbGet('photos',id);if(x)await idbPut('photos',{...x,...f});return}return this.photos.doc(id).update(f)},
  async del(x){if(LOCAL){await idbDel('photos',x.id);if(x.aid)await idbDel('blobs',x.aid);return}await this.photos.doc(x.id).delete();if(this.assets&&x.aid)this.assets.delete(x.aid).catch(()=>{})},
  async saveCats(list){if(LOCAL)return idbPut('meta',{list},'cats');return this.meta.set({list})},
  async loadLearn(){try{if(LOCAL){const m=await idbGet('meta','learn');return (m&&m.items)||[]}const s=await this.db.doc('meta/learn').get();return (s.exists&&s.data().items)||[]}catch(e){return[]}},
  async saveLearn(items){try{if(LOCAL)return await idbPut('meta',{items},'learn');return await this.db.doc('meta/learn').set({items})}catch(e){}},
  async usage(){if(LOCAL){const est=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate():null;return `사진 ${st.items.length}장 · 이 기기에 ${est?(est.usage/1048576).toFixed(1)+'MB':'?'} 사용`}
    const r=await this.assets.list(),u=r.usage;return `사진 ${u.files}/${u.maxFiles}장 · ${(u.bytes/1048576).toFixed(1)}MB / ${(u.maxBytes/1048576).toFixed(0)}MB · 기록 ${st.items.length}건`},
  async initLocal(){
    try{await idbOpen()}catch(e){ready=true;onData();return}
    this.ok=true;this.canUp=true;
    let meta=await idbGet('meta','cats');
    let rows=await idbAll('photos');
    if(!rows.length&&!LS.get('seeded',false)){await seedLocal();meta=await idbGet('meta','cats');rows=await idbAll('photos')}
    st.cats=(meta&&meta.list)||['미분류'];learn=await this.loadLearn();
    for(const r of rows)if(r.aid&&!urlCache[r.aid]){const b=await idbGet('blobs',r.aid);if(b)urlCache[r.aid]=URL.createObjectURL(b)}
    setAll(rows);ready=true;onData();
  },
  async refresh(){if(!LOCAL)return;setAll(await idbAll('photos'));const m=await idbGet('meta','cats');st.cats=(m&&m.list)||st.cats;onData()}
};
const urlCache={};
const TRASH_MS=7*864e5;let purged=false;
function setAll(a){st.all=a;st.items=a.filter(x=>!x.del);if(!purged){purged=true;a.filter(x=>x.del&&Date.now()-x.del>TRASH_MS).forEach(x=>Store.del(x).catch(()=>{}))}}
let learn=[]; // 추천을 고친 내역 (추천 → 최종), 최근 30개
let learnT;function noteLearn(x){
  if(!x.ai)return;const ai0=x.ai.memos&&x.ai.memos[0]||'';
  const changed=(x.cat||'미분류')!==x.ai.cat||(x.memo||'')!==ai0;
  learn=learn.filter(l=>l.id!==x.id);
  if(changed)learn.unshift({id:x.id,aiCat:x.ai.cat,aiMemo:ai0,cat:x.cat||'미분류',memo:(x.memo||'').slice(0,80),src:x.src||'',at:Date.now()});
  learn=learn.slice(0,30);clearTimeout(learnT);learnT=setTimeout(()=>Store.saveLearn(learn),800);
}
let idb=null;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('photo-manager',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('photos',{keyPath:'id'});d.createObjectStore('blobs');d.createObjectStore('meta')};r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>rej(r.error)})}
const tx=(s,m)=>idb.transaction(s,m).objectStore(s);
const P=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=(s,k)=>P(tx(s,'readonly').get(k));
const idbAll=s=>P(tx(s,'readonly').getAll());
const idbPut=(s,v,k)=>P(k===undefined?tx(s,'readwrite').put(v):tx(s,'readwrite').put(v,k));
const idbDel=(s,k)=>P(tx(s,'readwrite').delete(k));
async function seedLocal(){
  try{const r=await fetch('seed/seed.json');if(!r.ok)return;const j=await r.json();
    await idbPut('meta',{list:j.cats},'cats');
    for(const p of j.photos){const b=await (await fetch('seed/'+p.file)).blob();await idbPut('blobs',b,p.aid);const {file,...doc}=p;await idbPut('photos',doc)}
    LS.set('seeded',true)}catch(e){}
}

/* ───── 버튼 사용 횟수 → 거의 안 쓰는 버튼은 ⋯ 안으로 ───── */
const TOOLS=[{k:'search',ic:'🔍',t:'검색'},{k:'bycat',ic:'🗂',t:'분류별 모아보기 (전체 기간)'},{k:'report',ic:'📋',t:'리포트 (3일·1주)'},{k:'today',ic:'오늘',t:'오늘로'}];
const MENU=[{k:'export',t:'📦 내보내기 (사진+메모 zip)'},{k:'cats',t:'분류 편집'},{k:'aiall',t:'✨ 미분류 전부 추천받기'},{k:'thumbs',t:'▣ 썸네일 핵심 부분 자동 맞추기'},{k:'set',t:'화면·추천 설정'},{k:'trash',t:'🗑 휴지통 (7일 보관)'},{k:'store',t:'저장 공간'}];
const use=LS.get('use',{});
function count(k){use[k]=(use[k]||0)+1;LS.set('use',use)}
function folded(k){const tot=Object.values(use).reduce((a,b)=>a+b,0);if(k==='search')return false;return tot>=40&&(use[k]||0)/tot<0.03}
function renderTools(){
  $('#tools').innerHTML=TOOLS.filter(t=>!folded(t.k)).map(t=>`<button class="ib ${st.mode===({search:'search',report:'report',bycat:'bycat'}[t.k])?'on':''}" data-tool="${t.k}" title="${t.t}" aria-label="${t.t}" style="${t.k==='today'?'font-size:11px;padding:0 6px':''}">${t.ic}</button>`).join('');
  const extra=TOOLS.filter(t=>folded(t.k)).map(t=>({k:t.k,t:t.ic+' '+t.t}));
  $('#menu').innerHTML=[...extra,...MENU].map(m=>`<button data-tool="${m.k}">${m.t}</button>`).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;count(b.dataset.tool);$('#menu').hidden=true;act(b.dataset.tool)});
function act(k){
  if(k==='search'){st.mode=st.mode==='search'?'day':'search';if(st.mode==='search')setTimeout(()=>$('#sIn').focus(),30)}
  else if(k==='report'){st.mode=st.mode==='report'?'day':'report';st.ra=st.date}
  else if(k==='bycat'){st.mode=st.mode==='bycat'?'day':'bycat'}
  else if(k==='today'){st.date=ymd(new Date());st.mode='day';st.gf='';LS.set('gf','')}
  else if(k==='cats')return sheetCats();
  else if(k==='set')return sheetSet();
  else if(k==='store')return sheetStore();
  else if(k==='trash')return sheetTrash();
  else if(k==='aiall')return aiAll();
  else if(k==='thumbs')return thumbAll();
  else if(k==='export')return sheetExport();
  render();
}
$('#bMore').onclick=e=>{e.stopPropagation();count('more');$('#menu').hidden=!$('#menu').hidden};
document.addEventListener('click',e=>{if(!e.target.closest('#menu,#bMore'))$('#menu').hidden=true});

/* ───── 목록 ───── */
const GR=[['A','또 볼 것'],['B','필요할 때'],['C','봤고 끝']];
const GNM={A:'또 볼 것',B:'필요할 때',C:'봤고 끝'};
const GRK=x=>({A:0,B:1,'':2,C:3})[gOf(x)];
const gOf=x=>{const g=x.g==='D'?'C':x.g;return g||(x.done?'C':'')};
const gCount=a=>{const c={A:0,B:0,C:0};let n=0;a.forEach(x=>{const g=gOf(x);if(g)c[g]++;else n++});return GR.map(([k])=>c[k]?GNM[k]+' '+c[k]:'').filter(Boolean).join(' · ')+(n?(GR.some(([k])=>c[k])?' · ':'')+'미정 '+n:'')||'—'};
const catColor=c=>{const i=st.cats.indexOf(c);return i<0?'#6b7280':PAL[i%PAL.length]};
const dayItems=d=>st.items.filter(x=>x.date===d).sort((a,b)=>(a.seq||0)-(b.seq||0));
const seqOf=x=>dayItems(x.date).indexOf(x);
function mfHtml(){const unc=st.items.filter(x=>(x.cat||'미분류')==='미분류').length;const pool=st.mode==='bycat'||st.gf?st.items:dayItems(st.date),h=pool.filter(hasMy).length,todo=st.items.filter(x=>!hasMy(x)).length;
  return [['','메모 전체',pool.length],['has','✎ 있음',h],['none','✎ 없음',pool.length-h]].map(([k,t,n])=>`<button class="gf ${st.mf===k?'on':''}" data-mf="${k}">${t}<b>${n}</b></button>`).join('')+(todo?`<button class="fill" data-fill title="날짜 상관없이 나의 메모 없는 사진을 차례로">✎ 채우기 ${todo}</button>`:'<span class="fin">전부 채움 ✓</span>')+(unc?`<button class="fill" data-catm style="background:var(--gD)">🗂 분류 정하기 ${unc}</button>`:'')+(aiQ.size?`<span class="fin" style="background:var(--accent)">✨ 추천 중 ${aiQ.size}</span>`:'')}
const hasMy=x=>!!String(x.my||'').trim();
const mfF=a=>st.mf==='has'?a.filter(hasMy):st.mf==='none'?a.filter(x=>!hasMy(x)):a;
function visible(){
  if(st.mode==='search'){const q=st.q.trim().toLowerCase();if(!q)return[];return st.items.filter(x=>[x.memo,x.my,x.cat,x.src,x.date].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)||(a.seq-b.seq))}
  const cf=a=>mfF(st.cat==='전체'?a:a.filter(x=>(x.cat||'미분류')===st.cat));
  if(st.gf){const g=st.gf==='none'?'':st.gf;return cf(st.items.filter(x=>gOf(x)===g)).sort((p,q)=>q.date.localeCompare(p.date)||(p.seq-q.seq))}
  return cf(dayItems(st.date)).sort((p,q)=>GRK(p)-GRK(q)||(p.seq||0)-(q.seq||0));
}
function rowHtml(x,showDate){
  const n=seqOf(x),c=x.cat||'미분류',col=catColor(c),busy=st.ai[x.id]==='busy';
  const g=gOf(x);
  return `<div class="it ${g?'g-'+g:''}" data-id="${x.id}" role="button" tabindex="0">
   <div class="thw"><img src="${Store.img(x)}" alt="" loading="lazy" ${x.thumb?`class="rg" data-r="${x.thumb.join(',')}" onload="fitThumb(this)"`:''}></div>
   <div class="ix"><div class="h"><span class="sq">${CIRC[n]||'('+(n+1)+')'}</span>
     <span class="cat" style="background:${col}1f;color:${col}">${esc(c)}</span>
     ${showDate?`<span class="dt">${lbl(x.date)}</span>`:''}${busy?'<span class="spin" aria-label="추천 중"></span>':(x.aiApplied?'<span class="badge">✨</span>':'')}<span class="src">${esc(x.src||'')}</span></div>
     <div class="memo">${esc(x.memo||(busy?'Claude가 보고 있어요…':(x.my?'':'메모 없음')))}${x.my?`<span style="color:var(--accent)">${x.memo?' · ':''}✎ ${esc(x.my)}</span>`:''}</div></div>
   <button class="gb ${g?'g-'+g:''}" data-ck="${x.id}" aria-label="등급 ${g?GNM[g]:'없음'} · 누르면 바꾸기"></button></div>`;
}
/* 썸네일: 사진 중 핵심 영역(r=[x,y,w,h] 0~1)만 칸에 꽉 차게, 비율 유지 */
window.fitThumb=im=>{try{const r=im.dataset.r.split(',').map(Number),b=im.parentElement.getBoundingClientRect(),nw=im.naturalWidth,nh=im.naturalHeight;if(!nw||!b.width)return;
  const k=Math.max(b.width/(r[2]*nw),b.height/(r[3]*nh)),w=nw*k,h=nh*k,cx=(r[0]+r[2]/2)*w,cy=(r[1]+r[3]/2)*h;
  let l=b.width/2-cx,t=b.height/2-cy;l=Math.min(0,Math.max(b.width-w,l));t=Math.min(0,Math.max(b.height-h,t));
  Object.assign(im.style,{width:w+'px',height:h+'px',left:l+'px',top:t+'px'})}catch(e){}};
let deep=(location.hash||'').slice(1);
const aiQ=new Set(),aiFail=new Set();let aiRun=false;
async function aiResume(){if(aiRun||LOCAL)return;aiRun=true;
  try{for(;;){const x=st.items.find(v=>(!v.cat||v.cat==='미분류')&&!v.memo&&!v.ai&&!aiFail.has(v.id)&&st.ai[v.id]!=='busy');if(!x)break;aiQ.add(x.id);render();
      try{await recommend(x,{apply:true})}catch(e){}aiQ.delete(x.id);if(!x.ai)aiFail.add(x.id)}}finally{aiRun=false;render()}}
let thumbAutoRan=false;
function onData(){if(ready&&S.autoAi)setTimeout(aiResume,800);if(ready&&!thumbAutoRan&&!LOCAL&&st.items.some(x=>!x.thumb)){thumbAutoRan=true;setTimeout(()=>thumbAll().catch(()=>{}),1500)}if(deep&&ready){const id=deep;deep='';const x=st.items.find(i=>i.id===id);if(x){st.date=x.date;st.mode='day';st.cat='전체';openView(id);return}}if(st.open&&!dirty&&!document.activeElement?.matches('textarea,input,select'))drawView();render()}

  {const c={A:0,B:0,C:0,none:0};st.items.forEach(x=>{c[gOf(x)||'none']++});
   $('#legend').innerHTML=`<button class="gf ${!st.gf?'on':''}" data-gf="">등급 전체</button>`+[['A','또 볼 것'],['B','필요할 때'],['C','봤고 끝'],['none','미정']].map(([k,t])=>`<button class="gf g-${k} ${st.gf===k?'on':''}" data-gf="${k}"><span></span>${t}<b>${c[k]}</b></button>`).join('')+'<span style="width:1px;height:20px;background:var(--line);margin:0 3px"></span>'+mfHtml();}

let sampleNs;async function getSample(){if(LOCAL)return null;if(sampleNs===undefined){try{sampleNs=await window.claude.use('sample')}catch(e){sampleNs=null}}return sampleNs}
const aiPrompt=()=>`이 스크린샷/사진을 보고 개인 스크랩 앱에 정리할 정보를 JSON으로만 답하세요.
기존 분류 목록: ${JSON.stringify(st.cats.filter(c=>c!=='미분류'))}
규칙:
- cat: 기존 분류 중 가장 맞는 것 하나. 정말 맞는 게 없을 때만 새 분류 이름(2~6자, 「OO·OO」 형식 가능)을 만들고 isNew:true.
- memos: 메모 후보 3개. 각 50자 이내 한국어. 사진 핵심 내용 + (있으면) "→ 쓸 곳". 스레드·유튜브 등 출처가 보이면 메모 안에 짧게 넣기(예: "@아이디 스레드: …"). 1번이 가장 좋은 것. 과장·추측 금지, 보이는 내용 위주.
- src: 출처(예: "스레드 @아이디", "유튜브 채널명", "인스타 @아이디"). 모르면 "".
${learn.length?`사용자가 예전 추천을 이렇게 고쳤습니다. 같은 실수를 반복하지 말고, 고친 쪽의 분류 기준·메모 말투를 따르세요:
${learn.slice(0,15).map(l=>`- 추천 [${l.aiCat}] "${l.aiMemo}" → 사용자 [${l.cat}] "${l.memo}"${l.src?' ('+l.src+')':''}`).join('\n')}
`:''}- thumb: 목록 작은 썸네일(가로:세로≈4:3)에 보여줄 핵심 영역 [x,y,w,h] (사진 전체 대비 0~1 비율). 스크린샷이면 내용이 한눈에 보이는 부분(첨부 사진 + 그 위 본문 몇 줄 등), 위쪽 메뉴·상태바·아래 댓글창은 빼기.
형식: {"cat":"...","isNew":false,"memos":["...","...","..."],"src":"...","thumb":[0.05,0.1,0.6,0.5]}`;
async function askClaude(blob){
  if(LOCAL){
    if(!S.key)throw new Error('설정에서 Anthropic API 키를 넣어 주세요');
    const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(blob)});
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:S.model||'claude-haiku-5-5',max_tokens:600,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:blob.type||'image/jpeg',data:b64}},{type:'text',text:aiPrompt()}]}]})});
    if(!res.ok)throw new Error('API 오류 '+res.status);
    const j=await res.json();const t=(j.content||[]).map(c=>c.text||'').join('');return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
  }
  const s=await getSample();if(!s)throw new Error('이 화면에서는 추천을 쓸 수 없습니다');
  return s.json(aiPrompt(),{images:[blob],modelTier:'quick'});
}
async function recommend(x,{apply,blob}={}){
  if(st.ai[x.id]==='busy')return;st.ai[x.id]='busy';render();if(st.open===x.id){await flush(x);dirty=false;drawView()}
  try{
    const b=blob||await Store.blob(x);
    const r=await askClaude(b);
    const memos=(r.memos||[]).filter(Boolean).slice(0,3).map(m=>String(m).slice(0,80));
    let cat=String(r.cat||'').trim()||'미분류';
    const aiRec={cat,isNew:!st.cats.includes(cat),memos,src:String(r.src||''),at:Date.now()};
    const f={ai:aiRec};const th=okThumb(r.thumb);if(th&&!x.thumbMan)f.thumb=th;
    if(apply&&(!x.cat||x.cat==='미분류')&&!x.memo){
      if(aiRec.isNew&&cat!=='미분류'){st.cats=[...st.cats.filter(c=>c!=='미분류'),cat,'미분류'];await Store.saveCats(st.cats)}
      Object.assign(f,{cat,memo:memos[0]||'',src:x.src||aiRec.src,aiApplied:true});
    }
    delete st.ai[x.id];await save(x,f,{noLearn:true});
  }catch(e){delete st.ai[x.id];toast('추천 실패: '+(e.message||e.code||'알 수 없음'))}
  render();if(st.open===x.id){await flush(x);dirty=false;drawView()}
}

const thumbPrompt=`이 스크린샷/사진을 목록의 작은 썸네일(가로:세로≈4:3)로 보여줄 때, 내용이 한눈에 보이는 핵심 영역을 고르세요. 첨부 사진과 그 바로 위 본문 몇 줄 위주, 위쪽 메뉴·상태바·아래 댓글창은 제외. JSON만: {"thumb":[x,y,w,h]} (0~1 비율)`;

  R.querySelector('#cKeep').onclick=()=>end('keep');
  R.querySelector('#cAll')&&(R.querySelector('#cAll').onclick=()=>end('all'));
  if(pick!==undefined){R.querySelector('#cKeep').textContent='자동으로';R.querySelector('#cKeep').onclick=()=>end({auto:true});R.querySelector('#cOk').onclick=()=>end({r:[crop.x,crop.y,crop.w,crop.h]});return}
  R.querySelector('#cOk').onclick=()=>{const sx=Math.round(crop.x*img.width),sy=Math.round(crop.y*img.height),sw=Math.max(1,Math.round(crop.w*img.width)),sh=Math.max(1,Math.round(crop.h*img.height));
    const M=1800,k=Math.min(1,M/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
    c.toBlob(b=>end(b||'keep'),'image/jpeg',.88)};
})}
/* 올린 사진 다시 자르기: 원본(orig)에서 다시 · 원본은 남겨 둠 */
async function recrop(x){
  let src;try{src=await Store.blob(x.orig?{aid:x.orig}:x)}catch(e){}if(!src)return toast('사진을 불러오지 못했어요');
  const r=await cropUI(src);if(!r||r==='keep')return;
  try{toast('바꾸는 중…');const aid=await Store.upload(r);const old=x.aid,orig=x.orig||old;
    await save(x,{aid,orig},{noLearn:true});if(old!==orig&&Store.assets&&!LOCAL)Store.assets.delete(old).catch(()=>{});
    if(LOCAL)await Store.refresh();render();drawView();toast('자르기 적용')}catch(e){toast('저장 실패: '+(e.message||e.code))}
}
async function step(n){const i=viewList.findIndex(v=>v.id===st.open),j=i+n;if(j<0||j>=viewList.length){toast(n>0?'마지막 사진':'첫 사진',800);return}
  aiOpen=false;const ae=document.activeElement,fid=ae&&['vMemo','vMy'].includes(ae.id)?ae.id:null,sc=document.querySelector('.vbox')?.scrollTop||0;
  const x=st.items.find(v=>v.id===st.open);if(x&&dirty){await flush(x);toast('저장하고 넘김',800)}dirty=false;st.open=viewList[j].id;drawView();
  const vb=document.querySelector('.vbox');if(vb)vb.scrollTop=sc;
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{el.selectionStart=el.selectionEnd=el.value.length}catch(e){}}}
  soloSync()}
document.addEventListener('keydown',e=>{if(st.open==null||document.querySelector('.solo'))return;if(e.target.matches('textarea,input'))return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key==='Escape')closeView()});

/* ───── 사진 추가 (줄여서 저장 → 자동 추천) ───── */
function shrink(file){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const M=1800,s=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),'image/jpeg',.86)};im.onerror=()=>res(file);im.src=u})}
$('#fIn').onchange=async e=>{
  const fs=[...e.target.files];e.target.value='';if(!fs.length)return;
  if(!Store.canUp){toast('사진 저장소를 쓸 수 없습니다 (편집 권한 필요)');return}
  const date=st.mode==='day'?st.date:ymd(new Date());let seq=Math.max(0,...dayItems(date).map(v=>v.seq||0));
  const cat=st.cat!=='전체'?st.cat:'미분류';const added=[];
  let skipCrop=!LS.get('cropOnAdd',true);
  for(const [k,f] of fs.entries()){
    let src=f,cr='keep';
    if(!skipCrop){cr=await cropUI(f,{multi:fs.length-k>1});if(cr===null){toast('여기서 멈춤');break}if(cr==='all'){skipCrop=true;cr='keep'}}
    toast(`올리는 중 ${k+1}/${fs.length}`);
    try{const b0=await shrink(f),b=cr instanceof Blob?cr:b0;const oid=cr instanceof Blob?await Store.upload(b0):'';const aid=await Store.upload(b);seq++;
      const doc={aid,...(oid?{orig:oid}:{}),date,seq,cat,memo:'',my:'',src:'',g:'',done:false,ts:Date.now(),fname:f.name||''};
      const id=await Store.add(doc);const x={id,...doc};st.items.push(x);added.push([x,b])}
    catch(err){toast('업로드 실패: '+(err.message||err.code))}}
  st.date=date;st.mode='day';if(LOCAL)await Store.refresh();render();
  if(!added.length)return;
  openView(added[0][0].id);
  if(S.autoAi){for(const [x,b] of added){const cur=st.items.find(v=>v.id===x.id)||x;await recommend(cur,{apply:true,blob:b})}}
  else toast('분류와 메모를 정해 주세요');
};

/* ───── 시트 ───── */
function sheet(html){$('#sheetRoot').innerHTML=`<div class="ov" id="shOv" style="background:rgba(0,0,0,.35);align-items:flex-end;padding:0"></div><div class="sheet">${html}<div class="acts" style="margin-top:10px"><span style="flex:1"></span><button class="btn pri" id="shOk">닫기</button></div></div>`;
  $('#shOv').onclick=closeSheet;$('#shOk').onclick=closeSheet}
function closeSheet(){$('#sheetRoot').innerHTML='';render();if(st.open&&!dirty)drawView()}
function sheetTrash(){
  const t=(st.all||[]).filter(x=>x.del).sort((a,b)=>b.del-a.del);
  sheet(`<h3>휴지통 <small style="color:var(--mute);font-weight:400">지운 지 7일 지나면 완전히 사라짐</small></h3>`+(t.length?t.map(x=>{const left=Math.max(0,Math.ceil((x.del+TRASH_MS-Date.now())/864e5));
    return `<div class="r"><div class="thw" style="--th:1.4cm"><img src="${Store.img(x)}" alt=""></div><label style="font-size:13px">${lbl(x.date)} · ${esc(x.cat||'미분류')}<br><small style="color:var(--mute)">${esc((x.memo||x.my||'메모 없음').slice(0,40))} · ${left}일 남음</small></label><button class="btn pri" data-rs="${x.id}">되살리기</button><button class="btn del" data-kill="${x.id}">바로 지우기</button></div>`}).join(''):'<p class="hint">비어 있어요</p>'));
  document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{const x=st.all.find(v=>v.id===b.dataset.rs);if(!x)return;await Store.update(x.id,{del:null});x.del=null;setAll(st.all);if(LOCAL)await Store.refresh();toast('되살림');sheetTrash()});
  document.querySelectorAll('[data-kill]').forEach(b=>{let arm=false;b.onclick=async()=>{if(!arm){arm=true;b.textContent='한 번 더';b.classList.add('arm');return}const x=st.all.find(v=>v.id===b.dataset.kill);if(!x)return;st.all=st.all.filter(v=>v!==x);setAll(st.all);await Store.del(x).catch(()=>{});if(x.orig&&x.orig!==x.aid&&Store.assets&&!LOCAL)Store.assets.delete(x.orig).catch(()=>{});toast('완전히 지움');sheetTrash()}});
}
let focusCat=null;
function sheetCats(c){focusCat=c||null;
  const draw=()=>{sheet(`<h3>분류 편집</h3>${st.cats.map((c,i)=>`<div class="r" data-row="${i}"><span data-drag="${i}" style="touch-action:none;cursor:grab;font-size:20px;padding:0 6px;color:var(--mute)" aria-label="끌어서 순서">≡</span><i style="width:9px;height:9px;border-radius:50%;background:${PAL[i%PAL.length]}"></i><input id="ct${i}" value="${esc(c)}"><button class="btn" data-up="${i}" aria-label="위로">↑</button><button class="btn del" data-rmc="${i}">삭제</button></div>`).join('')}
   <div class="r"><input id="ctNew" placeholder="새 분류 이름"><button class="btn pri" id="ctAdd">추가</button></div>
   <p class="hint" style="text-align:left">≡를 잡고 끌면 순서 바뀜. 이름을 바꾸면 그 분류의 사진도 같이 바뀝니다. 삭제한 분류의 사진은 「미분류」로 갑니다.</p>`);
   st.cats.forEach((c,i)=>{$('#ct'+i).onchange=e=>rename(c,e.target.value.trim())});
   document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;if(!i)return;[st.cats[i-1],st.cats[i]]=[st.cats[i],st.cats[i-1]];saveCats();draw()});
   document.querySelectorAll('[data-rmc]').forEach(b=>b.onclick=()=>{const c=st.cats[+b.dataset.rmc];st.cats=st.cats.filter(v=>v!==c);moveCat(c,'미분류');saveCats();draw()});
   $('#ctAdd').onclick=()=>{const v=$('#ctNew').value.trim();if(v&&!st.cats.includes(v)){st.cats.push(v);saveCats()}draw()};
   document.querySelectorAll('[data-drag]').forEach(h=>h.onpointerdown=e=>{e.preventDefault();const from=+h.dataset.drag,row=h.closest('.r');row.style.background='var(--accent-soft)';h.setPointerCapture(e.pointerId);let to=from;
     h.onpointermove=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-row]');if(el){to=+el.dataset.row;document.querySelectorAll('[data-row]').forEach(r=>r.style.borderTop=+r.dataset.row===to&&to!==from?'2px solid var(--accent)':'')}};
     h.onpointerup=()=>{h.onpointermove=h.onpointerup=null;if(to!==from){const [m]=st.cats.splice(from,1);st.cats.splice(to,0,m);saveCats()}draw()}});
   if(focusCat){const k=st.cats.indexOf(focusCat);const el=$('#ct'+k);if(el){el.focus();el.select&&el.select()}focusCat=null}};
  const rename=(a,b)=>{if(!b||a===b||st.cats.includes(b))return;st.cats=st.cats.map(v=>v===a?b:v);moveCat(a,b);saveCats();if(st.cat===a)st.cat=b;draw()};
  draw();
}
function moveCat(a,b){st.items.filter(x=>x.cat===a).forEach(x=>save(x,{cat:b}))}
function saveCats(){Store.saveCats(st.cats).catch(()=>toast('분류 저장 실패'))}
function sheetSet(){
  sheet(`<h3>화면·추천 설정 <small style="color:var(--mute);font-weight:400">— 바꾼 값은 다음에도 그대로</small></h3>
   <div class="r"><label>글자 크기 <b id="vfs">${S.fs}</b>px</label><input type="range" id="sfs" min="10" max="16" value="${S.fs}" style="flex:1"></div>
   <div class="r"><label>썸네일 <b id="vth">${S.th}</b>cm</label><input type="range" id="sth" min="1" max="3" step="0.1" value="${S.th}" style="flex:1"></div>
   <div class="r"><label>집중 보기 사진 크기 <b id="vvw">${S.vw}</b>%</label><input type="range" id="svw" min="50" max="92" value="${S.vw}" style="flex:1"></div>
   <div class="r"><label>테마</label>${['','light','dark'].map(t=>`<button class="btn ${S.theme===t?'pri':''}" data-th="${t}">${t===''?'기기':t==='light'?'밝게':'어둡게'}</button>`).join('')}</div>
   <div class="r"><label>사진 올릴 때 자르기 화면</label><button class="btn ${LS.get('cropOnAdd',true)?'pri':''}" id="sCrop">${LS.get('cropOnAdd',true)?'켬':'끔'}</button></div>
   <div class="r"><label>사진 올리면 Claude 자동 추천</label><button class="btn ${S.autoAi?'pri':''}" id="sAi">${S.autoAi?'켬':'끔'}</button></div>
   ${LOCAL?`<div class="r"><label>Anthropic API 키<br><small style="color:var(--mute)">이 기기에만 저장 · 추천에 사용</small></label><input type="password" id="sKey" value="${esc(S.key)}" placeholder="sk-ant-…" autocomplete="off"></div>`:''}`);
  [['fs','sfs','vfs'],['th','sth','vth'],['vw','svw','vvw']].forEach(([k,i,o])=>$('#'+i).oninput=e=>{S[k]=+e.target.value;$('#'+o).textContent=S[k];applySet()});
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;applySet();sheetSet()});
  $('#sAi').onclick=()=>{S.autoAi=!S.autoAi;applySet();sheetSet()};
  $('#sCrop').onclick=()=>{LS.set('cropOnAdd',!LS.get('cropOnAdd',true));sheetSet()};
  $('#sKey')&&($('#sKey').onchange=e=>{S.key=e.target.value.trim();applySet();toast('키 저장됨')});
}
async function sheetStore(){sheet(`<h3>저장 공간</h3><p id="stInfo">확인 중…</p>${LOCAL?'<p class="hint" style="text-align:left">이 주소(1.seyeon-tax.com)는 사진을 이 폰 안에 저장합니다. claude.ai 사진관리와는 따로 쌓입니다.</p>':''}`);
  try{$('#stInfo').textContent=await Store.usage()}catch(e){$('#stInfo').textContent='확인할 수 없습니다'}}

/* ───── 내보내기: 사진+메모 zip → 다운로드 폴더 ───── */
function sheetExport(){
  const ms=[...new Set(st.items.map(x=>x.date.slice(0,7)))].sort().reverse();
  sheet(`<h3>내보내기 <small style="color:var(--mute);font-weight:400">사진 + 목록(엑셀용 CSV) zip</small></h3>
   <div class="r"><label>범위</label><select id="exR" style="height:28px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit">
    <option value="all">전체 (${st.items.length}장)</option>${ms.map(m=>`<option value="${m}">${m.replace('-','년 ')}월 (${st.items.filter(x=>x.date.startsWith(m)).length}장)</option>`).join('')}
    <option value="day">보고 있는 날 ${lbl(st.date)}</option>${st.cat!=='전체'?`<option value="cat">분류 「${esc(st.cat)}」만</option>`:''}</select></div>
   <p class="hint" style="text-align:left">파일 이름: 날짜_순번_분류_메모.jpg · 저장되면 PC에서 클로드파일 폴더로 옮겨 두세요${LOCAL?' (크롬 설정 → 다운로드 → 「저장 위치 묻기」를 켜면 바로 클로드파일을 고를 수 있음)':''}.</p>
   <div class="acts"><button class="btn pri" id="exGo">zip 만들기</button><span id="exSt" class="hint"></span></div>`);
  $('#exGo').onclick=()=>doExport($('#exR').value);
}
async function doExport(r){
  const pick=st.items.filter(x=>r==='all'||(r==='day'?x.date===st.date:r==='cat'?(x.cat||'미분류')===st.cat:x.date.startsWith(r))).sort((a,b)=>a.date.localeCompare(b.date)||a.seq-b.seq);
  if(!pick.length)return toast('내보낼 사진이 없습니다');
  if(!window.JSZip)return toast('zip 도구를 불러오지 못했습니다');
  const z=new JSZip(),clean=s=>String(s||'').replace(/[\\/:*?"<>|\n\r]/g,' ').replace(/\s+/g,' ').trim();
  const rows=[['날짜','순번','분류','추천 메모','나의 메모','출처','등급','파일']];
  for(const [k,x] of pick.entries()){
    $('#exSt')&&($('#exSt').textContent=`${k+1}/${pick.length}`);
    const n=seqOf(x)+1,fn=`${x.date.replace(/-/g,'').slice(2)}_${pad(n)}_${clean(x.cat||'미분류')}_${clean(x.memo).slice(0,20)||'메모없음'}.jpg`;
    try{const b=await Store.blob(x);if(b)z.file('사진/'+fn,b)}catch(e){}
    rows.push([x.date,n,x.cat||'미분류',x.memo||'',x.my||'',x.src||'',gOf(x)?GNM[gOf(x)]:'',fn]);
  }
  z.file('목록.csv','﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n'));
  z.file('data.json',JSON.stringify({exportedAt:new Date().toISOString(),cats:st.cats,photos:pick},null,1));
  const now=new Date(),name=`${ymd(now).replace(/-/g,'').slice(2)}_${pad(now.getHours())}${pad(now.getMinutes())}_사진관리_내보내기${r==='all'?'':'_'+r}.zip`;
  const blob=await z.generateAsync({type:'blob'});
  try{
    if(LOCAL){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('다운로드 폴더에 저장: '+name)}
    else{const dl=await window.claude.use('downloads');if(!dl)return toast('이 화면에서는 저장할 수 없습니다');await dl.save({filename:name,data:blob});toast('저장: '+name)}
    closeSheet();
  }catch(e){toast('저장 취소됨')}
}

let tt;function toast(m,ms){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=m;clearTimeout(tt);tt=setTimeout(()=>el.remove(),ms||2000)}

render();
Store.init().catch(()=>{ready=true;render()});
if(LOCAL&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
